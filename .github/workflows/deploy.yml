name: Test, validate and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test and validate data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON databases
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    name: Build and publish to gh-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Project pages are served from /<repository>/ ; user/org pages use /
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Set the repository variable VITE_API_BASE_URL to your Submission API origin.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_REPOSITORY_URL: https://github.com/${{ github.repository }}

      - name: Preserve runtime config from gh-pages
        run: |
          git fetch --depth=1 origin gh-pages || true
          if git show FETCH_HEAD:config.json > dist/config.json 2>/dev/null; then
            echo "Preserved the existing gh-pages config.json"
          else
            echo "No existing config.json; using the build default"
          fi

      - name: Publish to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "deploy: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
